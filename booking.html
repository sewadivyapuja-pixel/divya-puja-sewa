<!DOCTYPE html>
<html lang="hi" id="bookingHtmlRoot" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Puja Sewa - Booking Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A0B10; color: #E2E8F0; }
        .serif-title { font-family: 'Cinzel', serif; }
        .form-input {
            width: 100%;
            background: #12141C;
            border: 1px solid #222638;
            border-radius: 12px;
            padding: 12px 16px;
            color: #E2E8F0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus { border-color: #D4AF37; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-10 px-4">

    <div class="max-w-2xl mx-auto w-full bg-[#12141C] border border-[#222638] rounded-3xl p-6 md:p-10 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="index.html" class="text-amber-500 font-serif font-bold text-sm tracking-wide">← Home Par Wapas Jayein</a>
            <h1 class="serif-title text-2xl md:text-3xl font-bold text-gray-100">Puja & Jaap Booking Form</h1>
            <p class="text-xs text-gray-400">Apni seva ke liye nishulk/seedha anushthan anurodh darj karein.</p>
        </div>

        <!-- Booking Form -->
        <form id=" pujaBookingForm" onsubmit="submitBooking(event)" class="space-y-5">
            
            <!-- Selected Service (Auto-Filled) -->
            <div class="space-y-1">
                <label class="text-xs text-amber-400 font-semibold">Chuni Gayi Puja / Jaap (Seva)</label>
                <input type="text" id="selectedService" readonly class="form-input bg-[#0A0B10] text-amber-300 font-bold">
            </div>

            <!-- Original & Alternative Contact Numbers -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Original Mobile Number *</label>
                    <input type="tel" id="origPhone" required class="form-input" placeholder="10-digit mobile number">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Alternative Mobile Number</label>
                    <input type="tel5" id="altPhone" class="form-input" placeholder="Optional alternate number">
                </div>
            </div>

            <!-- Email & Full Name -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Full Name *</label>
                    <input type="text" id="fullName" required class="form-input" placeholder="Aapka pura naam">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Email ID *</label>
                    <input type="email" id="emailId" required class="form-input" placeholder="your_email@gmail.com">
                </div>
            </div>

            <!-- Date & Location -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Puja/Jaap Date *</label>
                    <input type="date" id="bookingDateInput" required class="form-input">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-300">Address / Location *</label>
                    <input type="text" id="addressInput" required class="form-input" placeholder="Varanasi / City, Pincode">
                </div>
            </div>

            <!-- Additional Details -->
            <div class="space-y-1">
                <label class="text-xs text-gray-300">Vishesh Sankalp / Samasya (Optional)</label>
                <textarea id="userNotes" rows="2" class="form-input" placeholder="Gotra, naam ya vishesh anurodh yahan likhein..."></textarea>
            </div>

            <!-- Done Button & Receipt Download Option -->
            <div class="space-y-4 pt-4">
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-sm py-3.5 rounded-xl transition shadow-lg">
                    Done (Booking Darj Karein)
                </button>

                <!-- Receipt Download Section (Hidden initially, shown after booking) -->
                <div id="receiptSection" class="hidden text-center space-y-3 pt-2 border-t border-[#222638]">
                    <p class="text-xs text-green-400 font-semibold">✔ Aapki Booking Safaltapurvak Ho Chuki Hai!</p>
                    <button type="button" onclick="downloadReceipt()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition">
                        📥 Download Receipt (रसीद डाउनलोड करें)
                    </button>
                </div>
            </div>

        </form>

    </div>

    <footer class="text-center text-[11px] text-gray-500 mt-8">
        <p>Divya Puja Sewa • Vedic Sanatan Sansthan Varanasi</p>
    </footer>

    <script>
        const TELEGRAM_BOT_TOKEN = "8989054970:AAG-NMCyPNoNhpnOwG1j_naEfNy4N0tYyN8";
        const TELEGRAM_CHAT_ID = "8814734919";
        const ADMIN_WHATSAPP_1 = "919935179756";
        const ADMIN_WHATSAPP_2 = "918382909995";

        // Auto-fill service from localStorage if selected on home page
        window.onload = function() {
            const savedService = localStorage.getItem('bookingService') || 'Vedic Puja / Jaap Anushthan';
            document.getElementById('selectedService').value = savedService;
            document.getElementById('bookingDateInput.value = new Date().toISOString().split('T')[0];
        };

        function submitBooking(event) {
            event.preventDefault();

            const service = document.getElementById('selectedService').value;
            const name = document.getElementById('fullName').value;
            const origPhone = document.getElementById('origPhone').value;
            const altPhone = document.getElementById('altPhone').value || 'N/A';
            const email = document.getElementById('emailId').value;
            const date = document.getElementById('bookingDateInput').value;
            const address = document.getElementById('addressInput').value;
            const notes = document.getElementById('userNotes').value || 'None';

            const telegramMsg = `🛕 NEW PUJA/JAAP BOOKING!\n-----------------------------------\n✨ Seva: ${service}\n👤 Name: ${name}\n📞 Mobile: ${origPhone}\n📱 Alt Mobile: ${altPhone}\n✉️ Email: ${email}\n📅 Date: ${date}\n📍 Address: ${address}\n📝 Notes: ${notes}`;
            
            // Send to Telegram
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMsg })
            }).catch(e => console.log("Telegram Error:", e));

            const waMsg = `🛕 *NEW PUJA/JAAP BOOKING*%0A-----------------------------------%0A*Seva:* ${service}%0A*Name:* ${name}%0A*Mobile:* ${origPhone}%0A*Alt Mobile:* ${altPhone}%0A*Email:* ${email}%0A*Date:* ${date}%0A*Address:* ${address}%0A*Notes:* ${notes}`;
            
            // Open both WhatsApp numbers
            window.open(`https://wa.me/${ADMIN_WHATSAPP_1}?text=${waMsg}`, '_blank');
            window.open(`https://wa.me/${ADMIN_WHATSAPP_2}?text=${waMsg}`, '_blank');

            // Show Receipt Download Option
            document.getElementById('receiptSection').classList.remove('hidden');
            alert('Aapki booking safaltapurvak darj ho gayi hai aur admin ko alert bhej diya gaya hai!');
        }

        function downloadReceipt() {
            const service = document.getElementById('selectedService').value;
            const name = document.getElementById('fullName').value;
            const origPhone = document.getElementById('origPhone').value;
            const date = document.getElementById('bookingDateInput').value;
            const address = document.getElementById('addressInput').value;

            const receiptContent = `=== DIVYA PUJA SEWA - BOOKING RECEIPT ===\n\nSeva: ${service}\nName: ${name}\nMobile: ${origPhone}\nDate: ${date}\nAddress: ${address}\nStatus: Confirmed (Direct Booking)\n\nVedic Sanatan Sansthan, Varanasi\n========================================`;
            
            const blob = new Blob([receiptContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Divya_Puja_Receipt_${name.replace(/\s+/g, '_')}.txt`;
            link.click();
        }
    </script>
</body>
</html>
