<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking & Payment - Divya Puja Sewa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0D17',
                            card: '#15192B',
                            border: '#2A304D',
                            accent: '#D4AF37',
                            accentHover: '#B59226',
                            gold: '#F3E5AB'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0B0D17; color: #E2E8F0; }
        .serif-title { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-8 px-4">

    <div class="max-w-2xl mx-auto w-full bg-brand-card border border-brand-border rounded-2xl p-6 md:p-8">
        <!-- HEADER -->
        <div class="text-center mb-8">
            <h1 class="serif-title text-2xl md:text-3xl font-bold text-brand-gold">Divya Puja Sewa</h1>
            <p class="text-xs text-gray-400 mt-1">Puja Booking & Secure Payment Gateway</p>
        </div>

        <!-- BOOKING FORM -->
        <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Aapka Poora Naam *</label>
                <input type="text" id="bName" required placeholder="Naam likhein" class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-xs text-white focus:outline-none focus:border-brand-accent">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Mobile / WhatsApp Number *</label>
                    <input type="tel" id="bPhone" required placeholder="10-digit number" class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-xs text-white focus:outline-none focus:border-brand-accent">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Puja Date *</label>
                    <input type="date" id="bDate" required class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-xs text-white focus:outline-none focus:border-brand-accent">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Poora Pata (Address) *</label>
                <input type="text" id="bAddress" required placeholder="Ghar ka pata, City, Pin" class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-xs text-white focus:outline-none focus:border-brand-accent">
            </div>

            <button type="submit" class="w-full bg-brand-accent text-black font-bold py-3 text-xs rounded-lg hover:bg-brand-accentHover transition mt-6">
                Proceed to Payment Gate
            </button>
        </form>

        <!-- PAYMENT GATEWAY SECTION (Hidden Initially) -->
        <div id="paymentSection" class="hidden mt-8 border-t border-brand-border pt-6">
            <div class="bg-brand-dark/80 border border-brand-accent/40 rounded-xl p-5 text-center mb-6">
                <span class="text-xs text-brand-gold font-bold uppercase block tracking-wider mb-1">Scan QR or Choose Payment Method</span>
                <p class="text-xs text-gray-400">Total Amount to Pay: <span class="text-white font-bold text-base" id="payAmount">₹5,100</span></p>
            </div>

            <!-- OPTION 1: QR CODE -->
            <div class="flex flex-col items-center justify-center bg-white p-4 rounded-xl max-w-xs mx-auto mb-6">
                <img src="eaf33d5e1ade1669970c41af1ace24a8.jpg" alt="UPI QR Code" class="w-56 h-56 object-contain rounded-lg">
                <p class="text-[10px] text-gray-600 font-semibold mt-2">Scan with PhonePe / GPay / PayTM</p>
            </div>

            <!-- OPTION 2: UPI ID COPY -->
            <div class="bg-brand-dark border border-brand-border rounded-lg p-3 flex items-center justify-between mb-6 max-w-md mx-auto">
                <span class="text-xs text-gray-300 font-mono" id="upiId">8382909995-2@ybl</span>
                <button onclick="copyUPI()" class="bg-brand-border text-brand-gold text-xs font-semibold px-3 py-1.5 rounded hover:bg-brand-accent hover:text-black transition">
                    Copy UPI ID
                </button>
            </div>

            <!-- OPTION 3: DIRECT APP BUTTONS -->
            <div class="mb-6">
                <p class="text-center text-xs text-gray-400 mb-3">Or Pay Directly via Apps:</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-md mx-auto">
                    <a id="gpayBtn" href="#" target="_blank" class="bg-brand-card border border-brand-border rounded-lg p-2.5 text-center text-xs text-white hover:border-brand-accent transition flex items-center justify-center gap-1.5">
                        <span>🔵</span> GPay
                    </a>
                    <a id="phonepeBtn" href="#" target="_blank" class="bg-brand-card border border-brand-border rounded-lg p-2.5 text-center text-xs text-white hover:border-brand-accent transition flex items-center justify-center gap-1.5">
                        <span>🟣</span> PhonePe
                    </a>
                    <a id="paytmBtn" href="#" target="_blank" class="bg-brand-card border border-brand-border rounded-lg p-2.5 text-center text-xs text-white hover:border-brand-accent transition flex items-center justify-center gap-1.5">
                        <span>🔷</span> PayTM
                    </a>
                    <a id="bhimBtn" href="#" target="_blank" class="bg-brand-card border border-brand-border rounded-lg p-2.5 text-center text-xs text-white hover:border-brand-accent transition flex items-center justify-center gap-1.5">
                        <span>🟠</span> BHIM UPI
                    </a>
                </div>
            </div>

            <!-- TRANSACTION SUBMIT -->
            <div class="border-t border-brand-border/60 pt-5">
                <label class="block text-xs font-medium text-brand-gold mb-1">Payment karne ke baad UTR / Transaction ID daalein *</label>
                <input type="text" id="utrNo" placeholder="12-digit UTR / Ref No." class="w-full bg-brand-dark border border-brand-border rounded-lg p-3 text-xs text-white focus:outline-none focus:border-brand-accent mb-3">
                
                <button onclick="confirmFinalPayment()" class="w-full bg-emerald-600 text-white font-bold py-3 text-xs rounded-lg hover:bg-emerald-700 transition">
                    Submit Payment & Confirm Booking
                </button>
            </div>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8989054970:AAG-NMCyPNoNhpnOwG1j_naEfNy4N0tYyN8";
        const TELEGRAM_CHAT_ID = "8814734919";
        const WHATSAPP_NUMBERS = ["919555674448", "919935179756"];
        const UPI_ADDRESS = "8382909995-2@ybl";

        let currentBookingData = {};

        function copyUPI() {
            navigator.clipboard.writeText(UPI_ADDRESS);
            alert("UPI ID copied: " + UPI_ADDRESS);
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            
            currentBookingData = {
                name: document.getElementById("bName").value,
                phone: document.getElementById("bPhone").value,
                date: document.getElementById("bDate").value,
                address: document.getElementById("bAddress").value
            };

            // Setup UPI Intent Links
            const upiLink = `upi://pay?pa=${UPI_ADDRESS}&pn=DivyaPujaSewa&cu=INR`;
            document.getElementById("gpayBtn").href = upiLink;
            document.getElementById("phonepeBtn").href = upiLink;
            document.getElementById("paytmBtn").href = upiLink;
            document.getElementById("bhimBtn").href = upiLink;

            // Hide Form & Show Payment Options
            document.getElementById("bookingForm").classList.add("hidden");
            document.getElementById("paymentSection").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function confirmFinalPayment() {
            const utr = document.getElementById("utrNo").value;
            if(!utr) {
                alert("Kripya payment karne ke baad UTR/Transaction ID zaroor darj karein.");
                return;
            }

            // Send to Telegram
            const msg = `🙏 NEW PUJA BOOKING & PAYMENT!\n-----------------------------------\nName: ${currentBookingData.name}\nPhone: ${currentBookingData.phone}\nDate: ${currentBookingData.date}\nAddress: ${currentBookingData.address}\nUTR/Txn ID: ${utr}`;
            
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg })
            });

            // Open WhatsApp with details
            const waMsg = `🙏 *PUJA BOOKING PAYMENT CONFIRMATION*%0A-----------------------------------%0A*Name:* ${currentBookingData.name}%0A*Phone:* ${currentBookingData.phone}%0A*Date:* ${currentBookingData.date}%0A*Address:* ${currentBookingData.address}%0A*UTR/Txn ID:* ${utr}`;
            
            window.open(`https://wa.me/${WHATSAPP_NUMBERS[0]}?text=${waMsg}`, '_blank');

            alert("Thank You! Aapka payment detail bhej diya gaya hai. Hum aapko jald hi confirm karenge.");
        }
    </script>
</body>
</html>
